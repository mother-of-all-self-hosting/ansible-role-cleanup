---
- name: Perform cleanup installation tasks
  tags:
    - setup-all
    - setup-cleanup
    - install-cleanup
  block:
    - name: Install systemd-journald-autovacuum
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/install_logs.yml"

    - name: Install purge-old-kernels
      when: system_cleanup_kernels | bool and ansible_facts['os_family'] == "Debian"
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/install_kernels.yml"

- name: Perform cleanup tasks
  tags:
    - setup-all
    - setup-cleanup
    - install-cleanup
  block:
    - name: Clean up Docker
      when: system_cleanup_docker | bool and 'start' in ansible_run_tags
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/run_docker.yml"

    - name: Remove paths
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/run_paths.yml"

    - name: Upgrade packages and clean up the package manager
      when: system_cleanup_apt | bool and ansible_facts['os_family'] == "Debian"
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/run_apt.yml"

    - name: Purge old kernels
      when: system_cleanup_kernels | bool and ansible_facts['os_family'] == "Debian"
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/run_kernels.yml"
